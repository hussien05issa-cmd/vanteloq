[auth.email]
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Verify your email for Vanteloq"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Vanteloq password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your secure Vanteloq sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "You’ve been invited to Vanteloq"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new Vanteloq email address"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "Your Vanteloq security code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Vanteloq password was changed"
content_path = "./supabase/templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Vanteloq email address was changed"
content_path = "./supabase/templates/email-changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Your Vanteloq phone number was changed"
content_path = "./supabase/templates/phone-changed.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "A sign-in method was added to your Vanteloq account"
content_path = "./supabase/templates/identity-linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "A sign-in method was removed from your Vanteloq account"
content_path = "./supabase/templates/identity-unlinked.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "A verification method was added to your Vanteloq account"
content_path = "./supabase/templates/mfa-enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "A verification method was removed from your Vanteloq account"
content_path = "./supabase/templates/mfa-unenrolled.html"
