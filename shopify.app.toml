client_id = "eeb1934e31ab2bc3d36c6dc207d2ba41"
name = "Vanteloq"
application_url = "https://vanteloq.com"
embedded = false

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_customers,read_inventory,read_locations,read_orders,read_products"

[auth]
redirect_urls = [
  "https://vanteloq.com/api/v1/integrations/shopify-pos/callback",
  "https://vanteloq.com/api/v1/integrations/shopify/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "https://vanteloq.com/api/v1/integrations/shopify/webhook"

[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "products/create",
  "products/update",
  "products/delete",
  "inventory_levels/update",
  "locations/create",
  "locations/update",
  "locations/delete"
]
uri = "https://vanteloq.com/api/v1/integrations/shopify-pos/webhook"

[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "orders/create",
  "orders/updated",
  "orders/cancelled",
  "refunds/create",
  "products/create",
  "products/update",
  "products/delete",
  "inventory_levels/update",
  "locations/create",
  "locations/update",
  "locations/delete"
]
uri = "https://vanteloq.com/api/v1/integrations/shopify/webhook"
